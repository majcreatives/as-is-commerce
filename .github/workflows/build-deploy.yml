name: Build deployable release

# Produces the deployable package for a Hostinger staging/production move.
#
# GITHUB IS IN THE LOOP. Every change lands on `origin/main` first; nothing is
# built ad hoc on a developer machine and nothing is edited on the server. This
# workflow builds the application on a clean runner and attaches the resulting
# zip to a GitHub Release. The server downloads that zip; it never runs Node
# and never compiles the front-end itself.
#
# Triggers:
#   - workflow_dispatch: build from a given branch/tag on demand.
#   - push of a `stage*` tag: the normal deploy path (e.g. `stage20.5b.1`).
#
# Pushing to `main` alone does NOT build. An explicit tag is the deploy
# decision and stays as a permanent, versioned record.

on:
  workflow_dispatch:
  push:
    tags:
      - 'stage*'

permissions:
  contents: write

concurrency:
  group: build-deployable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install front-end dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Assemble deployable package
        shell: bash
        run: |
          set -euo pipefail
          pkg="/tmp/as-is-commerce-package"
          rm -rf "$pkg"
          mkdir -p "$pkg"

          # The deployable is the clean checkout plus production dependencies
          # and built assets — never a git repo, never tests, never local or
          # derived state, and never any environment file.
          #
          # The three templates are INCLUDED and the rest of `.env*` is not.
          # rsync takes the first matching rule, so each include has to precede
          # the excludes. `.env.production.example` is the template an operator
          # is supposed to build production from, and `.env.staging-vps.example`
          # is the template for the production-shaped staging VPS; if they were
          # left to the blanket `.env.*` exclude they would simply be absent
          # from the release, and nobody would find out until they were standing
          # on the server.
          rsync -a \
            --include '.env.example' \
            --include '.env.production.example' \
            --include '.env.staging-vps.example' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '_ide_helper.php' \
            --exclude 'storage/logs/*' \
            --exclude 'storage/framework/cache/data/*' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/views/*' \
            --exclude 'storage/*.key' \
            --exclude 'public/storage' \
            --exclude 'public/hot' \
            ./ "$pkg/"

          tag="${GITHUB_REF_NAME:-manual}"
          artifact="as-is-commerce-${tag}.zip"
          ( cd "$pkg" && zip -qr "/tmp/$artifact" . )

          echo "artifact_path=/tmp/$artifact" >> "$GITHUB_ENV"
          echo "artifact_name=$artifact" >> "$GITHUB_ENV"

      - name: Publish GitHub Release (tag builds)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A heredoc rather than a quoted argument, because these notes are
          # several paragraphs and wrapping one across YAML lines is a good way
          # to produce a workflow file that no longer parses.
          notes=$(cat <<'NOTES'
          Deployable built by GitHub Actions from GITHUB_SHA_PLACEHOLDER.

          On the server, build .env from .env.production.example -- NOT from
          .env.example, which is the developer template and ships APP_DEBUG=true,
          MAIL_MAILER=log and SESSION_SECURE_COOKIE=false. Then, before serving
          anybody:

              php artisan app:check-environment --strict

          which must exit 0. It reads configuration, changes nothing, prints no
          secrets, and fails the deploy on a debug-enabled, mail-less,
          payment-less or plaintext-cookie site. Server-side steps are in
          docs/STAGING_20_5B.md and docs/VERIFY_27_PRODUCTION_PREP.md.
          NOTES
          )
          gh release create "$GITHUB_REF_NAME" "$artifact_path" \
            --title "As-Is-Commerce $GITHUB_REF_NAME" \
            --notes "${notes//GITHUB_SHA_PLACEHOLDER/$GITHUB_SHA}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload artifact (manual builds)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_path }}
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Deploy to the production-shaped staging VPS (docs/STAGING_VPS.md).
  #
  # GATED BY A REPOSITORY VARIABLE, so it is dormant until the droplet actually
  # exists: unless the `STAGING_VPS_HOST` variable is set, this job evaluates to
  # a no-op skip and tag pushes keep deploying to Hostinger staging exactly as
  # before. When the VPS is provisioned and the variable + key are set, every
  # pushed `stage*` tag is deployed automatically from the same GitHub-built
  # release -- GitHub stays in the loop, nothing is built on the server.
  #
  # (`vars`, not `secrets`, because a job-level `if` is only guaranteed the
  # `github`, `needs`, `vars` and `inputs` contexts. The hostname is not
  # sensitive; only the deploy key is a secret.)
  #
  # The remote swap lives in `ops/deploy-staging-vps.sh` (versioned, reviewed
  # like any other code) rather than being inlined here. It is UNEXERCISED code
  # until the first droplet deploy at the move; the runbook calls that out.
  # ---------------------------------------------------------------------------
  deploy-staging-vps:
    name: Deploy to staging VPS
    needs: build
    if: github.ref_type == 'tag' && vars.STAGING_VPS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" \
            --pattern "as-is-commerce-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY"

      - name: Install deploy key
        env:
          STAGING_VPS_SSH_KEY: ${{ secrets.STAGING_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${STAGING_VPS_SSH_KEY}" > "$HOME/.ssh/id_ed25519_vps"
          chmod 600 "$HOME/.ssh/id_ed25519_vps"

      - name: Copy archive and run the staged swap
        env:
          STAGING_VPS_HOST: ${{ vars.STAGING_VPS_HOST }}
          STAGING_VPS_USER: ${{ vars.STAGING_VPS_USER }}
        run: |
          set -euo pipefail
          artifact="as-is-commerce-${GITHUB_REF_NAME}.zip"
          scp -i "$HOME/.ssh/id_ed25519_vps" \
            -o StrictHostKeyChecking=accept-new \
            ops/deploy-staging-vps.sh "$artifact" \
            "${STAGING_VPS_USER}@${STAGING_VPS_HOST}:/tmp/"
          ssh -i "$HOME/.ssh/id_ed25519_vps" \
            -o StrictHostKeyChecking=accept-new \
            "${STAGING_VPS_USER}@${STAGING_VPS_HOST}" \
            "bash /tmp/deploy-staging-vps.sh ${GITHUB_REF_NAME}"